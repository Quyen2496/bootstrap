<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refactored Layout</title>
    <!-- Nhúng Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 1. NAVBAR: Dùng Flexbox linh hoạt dựa trên nội dung (Content-first) */
        .flex-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #212529;
            color: white;
            padding: 1rem 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        /* 2. DASHBOARD: Dùng CSS Grid (Gỡ bỏ thẻ .column lồng nhau) */
        .grid-dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding: 1.5rem 0;
        }

        .widget {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1.5rem;
            background-color: #f8f9fa;
        }

        /* Span widget lớn theo Grid */
        .widget-large {
            grid-column: span 2;
            grid-row: span 2;
        }

        /* Media Query Responsive cho Dashboard trên Mobile */
        @media (max-width: 768px) {
            .grid-dashboard {
                grid-template-columns: 1fr;
            }
            .widget-large {
                grid-column: span 1;
                grid-row: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- 1. NAVBAR (Flexbox) -->
    <nav class="flex-navbar">
        <div class="fw-bold fs-4">Logo</div>
        <div class="nav-links">
            <span>Home</span>
            <span>About</span>
            <span>VeryLongGermanWordForDashboard</span>
            <span>Contact</span>
        </div>
        <div>Profile</div>
    </nav>

    <div class="container my-4">
        <!-- 2. DASHBOARD (CSS Grid - Bento Box Layout) -->
        <h2 class="mb-3 fs-4 fw-bold">Dashboard</h2>
        <div class="grid-dashboard">
            <div class="widget widget-large">Chart A (Chiếm 2x2 trong Grid)</div>
            <div class="widget">Chart B</div>
            <div class="widget">Chart C</div>
            <div class="widget">Chart D</div>
        </div>

        <!-- 3. PRICING (Bootstrap 5 Grid System) -->
        <h2 class="my-4 fs-4 fw-bold">Bảng Giá</h2>
        <div class="row g-3">
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Gói Cơ bản</h5>
                        <p class="card-text">Dành cho cá nhân trải nghiệm.</p>
                        <button class="btn btn-outline-primary w-100">Chọn gói</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card h-100 border-primary shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-primary">Gói Nâng cao</h5>
                        <p class="card-text">Phù hợp cho các nhóm nhỏ.</p>
                        <button class="btn btn-primary w-100">Chọn gói</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Gói Doanh nghiệp</h5>
                        <p class="card-text">Dành cho quy mô tổ chức lớn.</p>
                        <button class="btn btn-outline-primary w-100">Liên hệ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
